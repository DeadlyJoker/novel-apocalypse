<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阅读 · 苏苏工作室</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f5f0eb;color:#2c2c2c;min-height:100vh;
}
.container{max-width:820px;margin:0 auto;padding:20px}
/* Header */
.header{text-align:center;padding:30px 0 10px}
.header h1{font-size:1.6em;font-weight:600;margin-bottom:6px;color:#1a1a1a}
.header .sub{color:#999;font-size:0.85em;margin-bottom:20px}
/* Volume tabs */
.volume-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #e0dbd5;justify-content:center}
.volume-tabs button{
  padding:10px 24px;cursor:pointer;background:none;border:none;
  color:#999;font-size:0.95em;font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;
}
.volume-tabs button:hover{color:#666}
.volume-tabs button.active{color:#1a1a1a;border-bottom-color:#8b5e3c}
/* Chapter grid */
.chapter-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:30px;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.chapter-item{
  display:flex;align-items:center;padding:10px 14px;cursor:pointer;
  border-radius:6px;transition:background 0.15s;
}
.chapter-item:hover{background:#f5f0eb}
.chapter-item .num{width:50px;font-size:0.85em;color:#8b5e3c;font-weight:500;flex-shrink:0}
.chapter-item .title{flex:1;font-size:0.95em;color:#333}
.chapter-item .badge{font-size:0.7em;color:#e74c3c;font-weight:bold;margin-left:8px}
/* Reader */
.reader{display:none;background:#fff;border-radius:10px;padding:30px 36px;box-shadow:0 1px 4px rgba(0,0,0,0.06);line-height:2}
.reader.active{display:block}
.reader h2{font-size:1.3em;color:#1a1a1a;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #eee}
.reader p{margin-bottom:1.2em;text-indent:2em}
.reader-nav{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid #eee}
.reader-nav button{padding:8px 20px;background:#f5f0eb;border:1px solid #e0dbd5;border-radius:6px;cursor:pointer;color:#555;font-size:0.9em;transition:all 0.15s}
.reader-nav button:hover{background:#e8ddd0}
.reader-nav button:disabled{opacity:0.3;cursor:default}
.reader-nav .back-btn{background:transparent;border-color:transparent;color:#999}
.reader-nav .back-btn:hover{color:#666}
/* Loading */
.loading{text-align:center;padding:60px;color:#999}
.loading .spinner{display:inline-block;width:24px;height:24px;border:2px solid #e0dbd5;border-top-color:#8b5e3c;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px;color:#c0392b}
.back-link{display:block;text-align:center;margin-top:16px;color:#8b5e3c;text-decoration:none;font-size:0.9em}
.back-link:hover{text-decoration:underline}
footer{text-align:center;color:#bbb;font-size:0.8em;padding:30px 20px}
@media(max-width:640px){.reader{padding:20px}.reader h2{font-size:1.1em}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="book-title">加载中...</h1>
    <p class="sub" id="book-sub">...</p>
  </div>

  <div id="loading-view" class="loading"><div class="spinner"></div><p>正在加载章节...</p></div>
  
  <!-- 目录视图 -->
  <div id="toc-view" style="display:none">
    <div class="volume-tabs" id="volume-tabs"></div>
    <div class="chapter-grid" id="chapter-grid"></div>
    <a class="back-link" href="https://deadlyjoker.github.io/novel-apocalypse/">← 返回书架</a>
  </div>

  <!-- 阅读器视图 -->
  <div id="reader-view" class="reader"></div>
</div>
<footer>苏苏工作室 &copy; 2026</footer>
<script>
// ===== 书配置 =====
var BOOKS = {
  "neon-dust": {
    repo: "DeadlyJoker/novel-apocalypse",
    title: "霓虹尘埃",
    sub: "新天城 · 赛博朋克 · 热血长篇",
    path: "neon-dust/chapters",
    volumePattern: /^VOLUME-(\d+)/,
    chapterPattern: /CHAPTER-(\d+)\.md$/,
    volumeNames: {
      "VOLUME-01": "第一幕 · 钢铁医生",
      "VOLUME-02": "第二幕 · 钢铁兄弟",
      "VOLUME-03": "第三幕",
      "VOLUME-04": "第四幕",
      "VOLUME-05": "第五幕"
    }
  },
  "apocalypse": {
    repo: "DeadlyJoker/novel-apocalypse",
    title: "末日进化：基因王座",
    sub: "末日题材 · 基因进化 · 爽文",
    path: "chapters",
    volumePattern: null,
    chapterPattern: /^(\d+)-/,
    defaultVolume: "全本",
    volumeNames: {}
  }
};

var GITHUB_TOKEN = null;
var currentBook = null;
var currentVol = 0;
var chapters = [];
var currentIdx = -1;

// 获取 URL 参数
var params = new URLSearchParams(window.location.search);
var bookId = params.get('book') || 'neon-dust';

// ===== GitHub API 读取目录 =====
function listDir(owner, repo, path) {
  var url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path;
  var headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (GITHUB_TOKEN) headers['Authorization'] = 'token ' + GITHUB_TOKEN;
  return fetch(url, { headers: headers }).then(function(r) {
    if (!r.ok) throw new Error('无法读取目录 (HTTP ' + r.status + ')');
    return r.json();
  });
}

// ===== 初始化 =====
function init() {
  var book = BOOKS[bookId];
  if (!book) {
    document.getElementById('loading-view').innerHTML = '<div class="error">未知的书籍: ' + bookId + '</div>';
    return;
  }
  currentBook = book;
  document.getElementById('book-title').textContent = book.title;
  document.getElementById('book-sub').textContent = book.sub;

  listDir(book.repo.split('/')[0], book.repo.split('/')[1], book.path).then(function(files) {
    // 解析文件列表
    var mdFiles = files.filter(function(f) { return f.name.endsWith('.md') && f.type === 'file'; });
    
    if (book.volumePattern) {
      // VOLUME 结构
      var vols = {};
      mdFiles.forEach(function(f) {
        var vm = f.name.match(book.volumePattern);
        if (!vm) return;
        var volKey = 'VOLUME-' + vm[1];
        var cm = f.name.match(book.chapterPattern);
        if (!cm) return;
        var chapNum = parseInt(cm[1]);
        if (!vols[volKey]) vols[volKey] = [];
        vols[volKey].push({ num: chapNum, name: f.name, download_url: f.download_url });
      });
      // 排序卷
      var volKeys = Object.keys(vols).sort();
      chapters = [];
      volKeys.forEach(function(vk) {
        vols[vk].sort(function(a,b) { return a.num - b.num; });
        vols[vk].forEach(function(c) {
          chapters.push({ vol: vk, num: c.num, name: c.name, url: c.download_url,
            title: (book.volumeNames[vk] || vk) + ' 第' + c.num + '章' });
        });
      });
    } else {
      // 普通结构
      var list = [];
      mdFiles.forEach(function(f) {
        var cm = f.name.match(book.chapterPattern);
        var num = cm ? parseInt(cm[1]) : 0;
        list.push({ num: num, name: f.name, url: f.download_url,
          title: f.name.replace(/\.md$/, '').replace(/^\d+-/, '') });
      });
      list.sort(function(a,b) { return a.num - b.num; });
      chapters = list;
    }

    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('toc-view').style.display = 'block';
    renderTOC();

  }).catch(function(err) {
    document.getElementById('loading-view').innerHTML = '<div class="error">❌ 加载失败: ' + err.message + '</div>';
  });
}

// ===== 渲染目录 =====
function renderTOC() {
  var tabsEl = document.getElementById('volume-tabs');
  var gridEl = document.getElementById('chapter-grid');

  if (currentBook.volumePattern) {
    // 卷 Tab
    var vols = {};
    chapters.forEach(function(c) {
      if (!vols[c.vol]) vols[c.vol] = [];
      vols[c.vol].push(c);
    });
    var volKeys = Object.keys(vols).sort();
    
    tabsEl.innerHTML = '';
    volKeys.forEach(function(vk, i) {
      var btn = document.createElement('button');
      btn.textContent = currentBook.volumeNames[vk] || vk;
      btn.className = i === 0 ? 'active' : '';
      btn.onclick = function() { showVolume(vk); };
      tabsEl.appendChild(btn);
    });
    
    // 默认显示第一卷
    showVolume(volKeys[0]);
  } else {
    tabsEl.innerHTML = '';
    renderChapterList(chapters);
  }
}

function showVolume(vol) {
  currentVol = vol;
  document.querySelectorAll('#volume-tabs button').forEach(function(b, i) {
    b.className = b.textContent === (currentBook.volumeNames[vol] || vol) ? 'active' : '';
  });
  var chs = chapters.filter(function(c) { return c.vol === vol; });
  renderChapterList(chs);
  
  // 找到第一个章节在该卷中的索引
  if (chs.length > 0) {
    currentIdx = chapters.indexOf(chs[0]);
  }
}

function renderChapterList(list) {
  var gridEl = document.getElementById('chapter-grid');
  gridEl.innerHTML = list.map(function(c, i) {
    var isLatest = (c === list[list.length-1]);
    return '<div class="chapter-item" onclick="loadChapter(' + chapters.indexOf(c) + ')">' +
      '<div class="num">第' + c.num + '章</div>' +
      '<div class="title">' + c.title + '</div>' +
      (isLatest ? '<div class="badge">最新</div>' : '') +
      '</div>';
  }).join('');
}

// ===== 加载章节 =====
function loadChapter(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  currentIdx = idx;
  var ch = chapters[idx];
  
  var tocEl = document.getElementById('toc-view');
  var readerEl = document.getElementById('reader-view');
  tocEl.style.display = 'none';
  readerEl.className = 'reader active';
  readerEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';

  fetch(ch.url).then(function(r) {
    if (!r.ok) throw new Error('加载失败');
    return r.text();
  }).then(function(md) {
    var html = marked.parse(md);
    readerEl.innerHTML = '<h2>' + ch.title + '</h2>' + html +
      '<div class="reader-nav">' +
        '<button class="back-btn" onclick="showTOC()">← 目录</button>' +
        '<div>' +
          '<button id="prev-btn" onclick="loadChapter(' + (idx-1) + ')" ' + (idx <= 0 ? 'disabled' : '') + '>← 上一章</button> ' +
          '<button id="next-btn" onclick="loadChapter(' + (idx+1) + ')" ' + (idx >= chapters.length-1 ? 'disabled' : '') + '>下一章 →</button>' +
        '</div>' +
      '</div>';
    window.scrollTo({top: 0, behavior: 'smooth'});
  }).catch(function(e) {
    readerEl.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  });
}

function showTOC() {
  document.getElementById('toc-view').style.display = 'block';
  document.getElementById('reader-view').className = 'reader';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// 启动
init();
</script>
</body>
</html>
