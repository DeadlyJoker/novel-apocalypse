<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阅读 · 苏苏工作室</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f5f0;--card:#fff;--text:#333;--dim:#999;--accent:#8b5e3c;--border:#e0dbd5;--sidebar-w:300px;--radius:10px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
}

/* ===== Layout ===== */
.app{display:flex;height:100vh}
/* Sidebar */
.sidebar{
  width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
  box-shadow:1px 0 4px rgba(0,0,0,0.04);z-index:10;
}
.sidebar-header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1em;font-weight:600;color:#1a1a1a;margin-bottom:2px}
.sidebar-header .sub{font-size:0.75em;color:var(--dim)}
.sidebar-toggle{display:none}
.chapter-list{flex:1;overflow-y:auto;padding:8px 0}
.chapter-list::-webkit-scrollbar{width:4px}
.chapter-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.vol-group{margin-bottom:4px}
.vol-title{
  font-size:0.75em;font-weight:600;color:var(--dim);padding:10px 18px 6px;
  letter-spacing:1px;
}
.ch-item{
  display:flex;align-items:center;padding:8px 18px;cursor:pointer;font-size:0.85em;
  transition:all 0.12s;color:var(--text);border-left:3px solid transparent;
}
.ch-item:hover{background:#faf7f3}
.ch-item.active{background:#f5f0eb;border-left-color:var(--accent);font-weight:500}
.ch-item .num{color:var(--accent);width:40px;flex-shrink:0;font-size:0.8em}
.ch-item .badge{font-size:0.65em;color:#e74c3c;font-weight:600;margin-left:6px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{
  display:flex;align-items:center;padding:10px 20px;
  border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;
}
.menu-btn{display:none;background:none;border:none;font-size:1.1em;cursor:pointer;color:var(--dim);padding:4px 8px;margin-right:8px}
.menu-btn:hover{color:var(--text)}
.toolbar-title{font-size:0.85em;color:var(--dim)}
.toolbar-title strong{color:var(--text)}

.reader-area{flex:1;overflow-y:auto;padding:24px 32px 60px;max-width:800px;margin:0 auto;width:100%}
.reader-area::-webkit-scrollbar{width:4px}
.reader-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.reader-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--dim);font-size:0.9em;gap:8px;
}

.chapter-content{line-height:2;font-size:1em;animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chapter-content h2{font-size:1.15em;color:#1a1a1a;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.chapter-content p{margin-bottom:1em;text-indent:2em}
.chapter-content h3{font-size:1.05em;color:#1a1a1a;margin:1.5em 0 0.8em}
.chapter-content blockquote{
  border-left:3px solid var(--accent);padding:8px 14px;margin:1em 0;
  background:#faf7f3;border-radius:0 6px 6px 0;color:#555;font-size:0.95em;
}
.chapter-content code{background:#f5f0eb;padding:1px 5px;border-radius:3px;font-size:0.9em;color:var(--accent)}
.chapter-content pre{background:#faf7f3;padding:14px;border-radius:8px;overflow-x:auto;margin:1em 0;font-size:0.9em;border:1px solid var(--border)}
.reader-nav{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.reader-nav a{
  padding:6px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:6px;text-decoration:none;color:#555;font-size:0.8em;transition:all 0.12s;
}
.reader-nav a:hover{background:var(--bg)}
.reader-nav a.disabled{opacity:0.25;pointer-events:none}

.loading{text-align:center;padding:60px;color:var(--dim);font-size:0.9em}
.error{text-align:center;padding:40px;color:#c0392b;font-size:0.9em}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:fixed;left:-300px;top:0;height:100%;transition:left 0.25s ease;z-index:100}
  .sidebar.open{left:0}
  .sidebar.open + .overlay{display:block}
  .menu-btn{display:block}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:90}
  .reader-area{padding:16px 18px 40px}
  .sidebar-toggle{display:block;position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.2em;color:var(--dim);cursor:pointer}
}
</style>
</head>
<body>
<div class="app">
  <!-- 遮罩（移动端） -->
  <div class="overlay" onclick="closeSidebar()"></div>
  
  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" onclick="closeSidebar()">✕</button>
    <div class="sidebar-header">
      <h1 id="book-title">加载中...</h1>
      <div class="sub" id="book-sub"></div>
    </div>
    <div class="chapter-list" id="chapter-list">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <div class="toolbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="toolbar-title" id="toolbar-title">← <strong>选择章节开始阅读</strong></div>
    </div>
    <div class="reader-area" id="reader-area">
      <div class="reader-placeholder" id="placeholder">
        <span style="font-size:2em">📖</span>
        <span>从左侧目录选择章节</span>
      </div>
    </div>
  </div>
</div>
<script>
// ===== 配置 =====
var params = new URLSearchParams(window.location.search);
var bookId = params.get('book') || 'neon-dust';

var BOOKS = {
  "neon-dust": {
    title: "霓虹尘埃", sub: "新天城 · 赛博朋克 · 热血长篇",
    owner: "DeadlyJoker", repo: "novel-apocalypse", path: "neon-dust/chapters",
    volPat: /^VOLUME-(\d+)/, chPat: /CHAPTER-(\d+)\.md$/,
    volNames: {"VOLUME-01":"第一幕 · 钢铁医生","VOLUME-02":"第二幕 · 钢铁兄弟","VOLUME-03":"第三幕","VOLUME-04":"第四幕","VOLUME-05":"第五幕"}
  },
  "apocalypse": {
    title: "末日进化：基因王座", sub: "末日题材 · 基因进化 · 爽文",
    owner: "DeadlyJoker", repo: "novel-apocalypse", path: "chapters",
    volPat: null, chPat: /^(\d+)-/,
    volNames: {}
  }
};

var book = BOOKS[bookId];
if (!book) { document.getElementById('chapter-list').innerHTML = '未知书籍'; }

document.getElementById('book-title').textContent = book.title;
document.getElementById('book-sub').textContent = book.sub + ' · ' + book.path;

var allChapters = [];
var currentIdx = -1;

// ===== GitHub API =====
var apiUrl = 'https://api.github.com/repos/' + book.owner + '/' + book.repo + '/contents/' + book.path;

fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(renderSidebar)
  .catch(function(e) {
    document.getElementById('chapter-list').innerHTML = '<div class="error">加载失败: ' + e.message + '</div>';
  });

// ===== 渲染侧边栏 =====
function renderSidebar(files) {
  var mdFiles = files.filter(function(f) { return f.name.endsWith('.md'); });
  
  if (book.volPat) {
    // Volume-organized
    var vols = {};
    mdFiles.forEach(function(f) {
      var vm = f.name.match(book.volPat);
      var cm = f.name.match(book.chPat);
      if (!vm || !cm) return;
      var vk = 'VOLUME-' + vm[1];
      if (!vols[vk]) vols[vk] = [];
      vols[vk].push({ num: parseInt(cm[1]), name: f.name, url: f.download_url });
    });
    
    var html = '';
    var ordered = Object.keys(vols).sort();
    ordered.forEach(function(vk) {
      vols[vk].sort(function(a,b) { return a.num - b.num; });
      html += '<div class="vol-group"><div class="vol-title">' + (book.volNames[vk] || vk) + '</div>';
      vols[vk].forEach(function(c) {
        html += '<div class="ch-item" data-idx="' + allChapters.length + '" onclick="loadChapter(' + allChapters.length + ')">' +
          '<span class="num">' + c.num + '</span><span>' + c.name.replace(/\.md$/,'').replace(/^VOLUME-\d+-CHAPTER-\d+[：:]\s*/, '') + '</span></div>';
        allChapters.push({ url: c.url, name: c.name });
      });
      html += '</div>';
    });
    document.getElementById('chapter-list').innerHTML = html;
  }
  
  // Auto-load first chapter
  if (allChapters.length > 0) {
    loadChapter(0);
  }
}

// ===== 加载章节 =====
function loadChapter(idx) {
  if (idx < 0 || idx >= allChapters.length) return;
  currentIdx = idx;
  
  // Highlight
  document.querySelectorAll('.ch-item').forEach(function(el, i) {
    el.classList.toggle('active', parseInt(el.getAttribute('data-idx')) === idx);
  });
  
  var ch = allChapters[idx];
  var area = document.getElementById('reader-area');
  area.innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('toolbar-title').innerHTML = '← <strong>' + ch.name.replace(/\.md$/,'') + '</strong>';
  
  // Close sidebar on mobile
  closeSidebar();
  
  fetch(ch.url).then(function(r) { return r.text(); }).then(function(md) {
    var prevBtn = idx > 0 ? '<a href="#" onclick="loadChapter(' + (idx-1) + ');return false">← 上一章</a>' : '<a class="disabled">← 上一章</a>';
    var nextBtn = idx < allChapters.length - 1 ? '<a href="#" onclick="loadChapter(' + (idx+1) + ');return false">下一章 →</a>' : '<a class="disabled">下一章 →</a>';
    
    area.innerHTML = '<div class="chapter-content">' +
      marked.parse(md) +
      '<div class="reader-nav">' + prevBtn + nextBtn + '</div></div>';
    area.scrollTop = 0;
  }).catch(function(e) {
    area.innerHTML = '<div class="error">加载失败: ' + e.message + '</div>';
  });
}

// ===== 侧边栏切换 =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}
</script>
</body>
</html>
